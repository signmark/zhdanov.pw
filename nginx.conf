server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;
    gzip_min_length 1024;

    # Cache static assets
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2|woff|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Старые ссылки на русскую версию вида /?lang=ru ведут на /ru/ (task #17).
    # Раньше русский текст подставлялся скриптом на клиенте, и по этому адресу
    # сервер отдавал английский HTML с canonical на / — Google и Яндекс русскую
    # версию не видели. Теперь у неё свой адрес и свой canonical.
    location / {
        if ($arg_lang = "ru") { return 301 /ru/; }
        # Настоящий 404 вместо отката на главную: раньше любой несуществующий
        # адрес отдавался кодом 200 с главной страницей («мягкая 404» для
        # поисковика — это раздувание мусорных адресов в индексе).
        try_files $uri $uri/ =404;
    }

    # Своя страница 404, отдаётся с кодом 404, напрямую не открывается.
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
}
