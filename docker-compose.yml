version: '3.8'

services:
  zhdanov-pw:
    build: . # Собирает Dockerfile, лежащий рядом
    container_name: zhdanov-pw
    restart: unless-stopped
    networks:
      - traefik_proxy
    labels:
      - "traefik.enable=true"
      # Настройка для HTTP (с редиректом на HTTPS)
      - "traefik.http.routers.zhdanov-http.rule=Host(`zhdanov.pw`)"
      - "traefik.http.routers.zhdanov-http.entrypoints=web"
      - "traefik.http.routers.zhdanov-http.middlewares=redirect-to-https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
      # Настройка для HTTPS
      - "traefik.http.routers.zhdanov-https.rule=Host(`zhdanov.pw`)"
      - "traefik.http.routers.zhdanov-https.entrypoints=websecure"
      - "traefik.http.routers.zhdanov-https.tls=true"
      - "traefik.http.routers.zhdanov-https.tls.certresolver=mytlschallenge" # Привязали к правильному роутеру
      
      # www.zhdanov.pw -> https://zhdanov.pw
      - "traefik.http.routers.zhdanov-www.rule=Host(`www.zhdanov.pw`)"
      - "traefik.http.routers.zhdanov-www.entrypoints=web,websecure"
      - "traefik.http.routers.zhdanov-www.tls=true"
      - "traefik.http.routers.zhdanov-www.tls.certresolver=mytlschallenge"
      - "traefik.http.routers.zhdanov-www.middlewares=zhdanov-www-to-apex"
      - "traefik.http.middlewares.zhdanov-www-to-apex.redirectregex.regex=^https?://www\\.zhdanov\\.pw/(.*)"
      - "traefik.http.middlewares.zhdanov-www-to-apex.redirectregex.replacement=https://zhdanov.pw/$${1}"
      - "traefik.http.middlewares.zhdanov-www-to-apex.redirectregex.permanent=true"
      
      # Порт контейнера Nginx
      - "traefik.http.services.zhdanov-svc.loadbalancer.server.port=80"

networks:
  traefik_proxy:
    name: proxy
    external: true