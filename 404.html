<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Страница не найдена — zhdanov.pw</title>
  <meta name="robots" content="noindex, follow" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230e1113'/%3E%3Ctext x='32' y='41' text-anchor='middle' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='24' font-weight='700' fill='%2322d3ee'%3E%7B%3Ctspan fill='%23e5e7eb'%3Edz%3C/tspan%3E%7D%3C/text%3E%3C/svg%3E" />
  <!--
    Страница намеренно отдельная и без внешних файлов: стили здесь свои,
    шрифт — системный. Если 404 случился, assets/site.css может быть недоступен,
    и страница всё равно должна быть читаемой.
  -->
  <style>
    :root {
      --bg: #08090a; --surface: #0e1011; --line: #212527;
      --txt: #f2f4f5; --txt-2: #9ba3a8; --accent: #22d3ee;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: var(--bg); color: var(--txt);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
      padding: 24px;
    }
    .box {
      max-width: 460px; width: 100%; text-align: center;
      background: var(--surface); border: 1px solid var(--line);
      border-radius: 16px; padding: 40px 28px;
    }
    .code {
      font-family: ui-monospace, 'JetBrains Mono', SFMono-Regular, Menlo, monospace;
      font-size: 48px; font-weight: 700; color: var(--accent); margin: 0 0 12px;
    }
    h1 { font-size: 20px; font-weight: 600; margin: 0 0 10px; }
    p { font-size: 15px; line-height: 1.6; color: var(--txt-2); margin: 0 0 24px; }
    .links { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    a {
      display: inline-block; padding: 10px 18px; border-radius: 999px;
      border: 1px solid var(--line); color: var(--txt); text-decoration: none;
      font-size: 14px; font-weight: 500; transition: border-color .15s, color .15s;
    }
    a:hover { border-color: var(--accent); color: var(--accent); }
  </style>
</head>
<body>
  <main class="box">
    <p class="code">404</p>
    <h1>Такой страницы нет</h1>
    <p>Возможно, адрес набран с ошибкой или страница переехала. На главную:</p>
    <div class="links">
      <a href="/">На главную</a>
      <a href="/ru/" hreflang="ru" lang="ru">Русская версия</a>
    </div>
  </main>
</body>
</html>
